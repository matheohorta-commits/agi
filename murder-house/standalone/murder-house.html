<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Murder House Brick Set</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&family=Archivo:wght@700;800&display=swap">
<style>
/* Layout concept: a haunted house at night on a workbench - full-bleed 3D stage, a slim top bar with
   the modes and the radio, floating glass panels, and the instruction booklet opening as a lit spread. */
:root {
  --night: #100f15;          /* the dark around the house */
  --panel: rgba(26, 24, 33, 0.86);
  --panel-solid: #1b1922;
  --line: #34303d;
  --ink: #efe8dc;            /* warm paper white */
  --dim: #a69fb0;
  --brick: #c05a3c;          /* reddish brown brick, lifted to read on dark */
  --brick-deep: #7a3421;
  --amber: #e8b44e;          /* Tiffany glass */
  --ok: #7fcf8e;
  --warn: #f0a24a;
  --page: #bfdff2;           /* instruction booklet page blue */
  --page-deep: #a8d1ec;
  --page-ink: #13202b;
  --callout: #e9f5fc;
  --f-display: 'IM Fell English', 'Iowan Old Style', Georgia, serif;
  --f-ui: 'IBM Plex Sans Condensed', 'Arial Narrow', 'Roboto Condensed', system-ui, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --f-step: 'Archivo', 'Arial Black', 'Helvetica Neue', Arial, sans-serif;
  --r: 10px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--night); color: var(--ink); font: 15px/1.45 var(--f-ui); -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.app { height: 100%; display: grid; grid-template-rows: auto 1fr; grid-template-columns: minmax(0, 1fr); }

/* ------------------------------------------------ top bar */
.bar { min-width: 0; display: flex; align-items: center; gap: 16px; padding: 8px 16px; padding-top: calc(8px + env(safe-area-inset-top, 0px)); background: linear-gradient(#17151d, #121017); border-bottom: 1px solid var(--line); position: relative; z-index: 20; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.mark { width: 34px; height: 34px; color: var(--brick); flex: none; }
.brand-text h1 { font: italic 400 24px/1 var(--f-display); margin: 0; letter-spacing: 0.01em; white-space: nowrap; }
.brand-text p { margin: 2px 0 0; font-size: 12px; color: var(--dim); letter-spacing: 0.04em; white-space: nowrap; }
.tabs { display: flex; gap: 4px; margin-inline: auto; background: #0c0b10; padding: 4px; border-radius: 999px; border: 1px solid var(--line); overflow-x: auto; max-width: 100%; }
.tabs button { border: 0; background: none; padding: 7px 14px; border-radius: 999px; color: var(--dim); font-weight: 600; letter-spacing: 0.02em; white-space: nowrap; }
.tabs button[aria-selected="true"] { background: var(--brick); color: #fff; }
.tabs button:hover:not([aria-selected="true"]) { color: var(--ink); background: #1e1b25; }

/* ------------------------------------------------ radio */
.radio { position: relative; display: flex; align-items: center; gap: 8px; background: #0c0b10; border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px 3px 3px; }
.radio-play { width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--amber); color: #1b1305; display: grid; place-items: center; flex: none; }
.radio-play svg { width: 15px; height: 15px; fill: currentColor; }
.radio .i-pause, .radio.on .i-play { display: none; }
.radio.on .i-pause { display: block; }
.radio-station { display: flex; align-items: center; gap: 8px; border: 0; background: none; text-align: left; padding: 0; min-width: 0; }
.radio-text { display: grid; min-width: 0; }
.radio-text b { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 190px; }
.radio-text small { font-size: 11px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 190px; }
.eq { display: flex; align-items: flex-end; gap: 2px; height: 16px; width: 16px; }
.eq i { display: block; width: 3px; height: 4px; background: var(--amber); border-radius: 1px; }
.radio.on .eq i { animation: eq 0.9s ease-in-out infinite; }
.radio.on .eq i:nth-child(2) { animation-delay: -0.3s; } .radio.on .eq i:nth-child(3) { animation-delay: -0.6s; } .radio.on .eq i:nth-child(4) { animation-delay: -0.15s; }
@keyframes eq { 0%, 100% { height: 3px; } 50% { height: 15px; } }
#radio-vol { width: 70px; accent-color: var(--amber); }
.radio-menu { position: absolute; right: 0; top: calc(100% + 8px); width: min(360px, calc(100vw - 32px)); background: var(--panel-solid); border: 1px solid var(--line); border-radius: 14px; padding: 8px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5); z-index: 50; }
.radio-menu h3 { margin: 6px 8px 4px; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); font-weight: 600; }
.station { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 10px; }
.station:hover { background: #242130; }
.station button { border: 0; background: none; text-align: left; padding: 0; }
.station b { display: block; font-size: 14px; }
.station small { color: var(--dim); font-size: 12px; }
.station.active b { color: var(--amber); }
.station a { color: var(--dim); font-size: 12px; text-decoration: none; border: 1px solid var(--line); padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
.station a:hover { color: var(--ink); border-color: var(--dim); }
.yt-box { margin: 6px 8px 8px; border-radius: 10px; overflow: hidden; background: #000; aspect-ratio: 16 / 9; max-width: 100%; }
.yt-box iframe { width: 100%; height: 100%; border: 0; display: block; }
.yt-note { margin: 0 10px 6px; font-size: 12px; color: var(--dim); }

/* ------------------------------------------------ stage */
.stage { position: relative; overflow: hidden; min-height: 0; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; background: var(--night); z-index: 30; transition: opacity 0.6s; }
.loading.gone { opacity: 0; pointer-events: none; }
.loading p { font: italic 20px var(--f-display); color: var(--dim); }
.spinner { width: 48px; height: 30px; margin: 0 auto 10px; background: var(--brick); border-radius: 3px; position: relative; animation: bob 1s ease-in-out infinite; }
.spinner::before { content: ''; position: absolute; top: -7px; left: 7px; width: 12px; height: 7px; border-radius: 2px 2px 0 0; background: var(--brick); box-shadow: 22px 0 0 var(--brick); }
@keyframes bob { 50% { transform: translateY(-8px); } }

.app:not([data-mode="explore"]) .explore-only, .app:not([data-mode="build"]) .build-only,
.app:not([data-mode="booklet"]) .booklet-only, .app:not([data-mode="parts"]) .parts-only { display: none !important; }

.panel { position: absolute; left: 16px; top: 16px; width: 256px; max-height: calc(100% - 32px); overflow: auto; background: var(--panel); backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 14px; z-index: 5; }
.panel h2 { margin: 0 0 8px; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: #211e29; border-radius: 999px; padding: 4px 10px; font-size: 13px; }
.chip[aria-pressed="false"] { opacity: 0.45; text-decoration: line-through; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 10px; }
.seg button { border: 0; background: #1d1a24; padding: 6px 4px; font-size: 13px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button:hover { background: #2a2633; }
.slider { display: grid; gap: 2px; font-size: 13px; color: var(--dim); }
.slider input, .timeline input { accent-color: var(--brick); width: 100%; }
.toggles { display: flex; gap: 14px; margin-top: 8px; }
.switch { display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; }
.switch input { accent-color: var(--amber); }
.timeline { display: flex; gap: 8px; align-items: center; }
.icon-btn { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background: #221f2a; flex: none; }
.tl-label { margin: 6px 0 0; font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
.hint { margin: 0; font-size: 12px; color: var(--dim); }
.tip { position: absolute; pointer-events: none; z-index: 8; background: var(--panel-solid); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; font-size: 13px; max-width: 280px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4); }
.tip b { display: block; }
.tip code, .mono { font-family: var(--f-mono); font-size: 12px; color: var(--amber); }
.info-card { position: absolute; right: 16px; bottom: 16px; width: 300px; max-width: calc(100% - 32px); z-index: 9; background: var(--panel); backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; grid-template-columns: 72px 1fr; gap: 12px; }
.info-card img { width: 72px; height: 72px; background: #0e0d12; border-radius: 8px; }
.info-card h3 { margin: 0 0 4px; font-size: 15px; }
.info-card p { margin: 0; font-size: 13px; color: var(--dim); }
.info-card a { color: var(--amber); }
.info-card .x { position: absolute; top: 6px; right: 8px; border: 0; background: none; color: var(--dim); font-size: 18px; }
.swatch { display: inline-block; width: 11px; height: 11px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; border: 1px solid rgba(255, 255, 255, 0.25); }

/* ------------------------------------------------ build mode */
.build-hud { position: absolute; inset: 0; pointer-events: none; z-index: 6; display: grid; grid-template-rows: auto 1fr auto; }
.build-hud > * { pointer-events: auto; }
.build-top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin: 12px 16px 0; background: var(--panel); backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 14px; padding: 8px 12px; }
.build-step { display: flex; align-items: center; gap: 10px; min-width: 0; }
.build-num { font: 800 30px/1 var(--f-step); color: var(--amber); min-width: 2ch; font-variant-numeric: tabular-nums; }
.build-step b { display: block; font-size: 15px; }
.build-step small { color: var(--dim); font-size: 12px; }
.build-stats { color: var(--dim); font-size: 13px; font-variant-numeric: tabular-nums; }
.build-actions { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
.build-actions button, .bk-nav button, .parts .btn { border: 1px solid var(--line); background: #231f2b; border-radius: 8px; padding: 6px 11px; font-size: 13px; font-weight: 600; }
.build-actions button:hover, .bk-nav button:hover, .parts .btn:hover { background: #2e2938; }
.build-actions .primary, .parts .btn.primary { background: var(--brick); border-color: var(--brick); color: #fff; }
.build-actions [aria-pressed="true"] { background: var(--amber); color: #1b1305; border-color: var(--amber); }
.tray { grid-row: 3; display: flex; gap: 10px; overflow-x: auto; padding: 12px 16px; padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(transparent, rgba(8, 7, 11, 0.85) 30%); }
.lot { position: relative; flex: none; width: 96px; border: 1px solid var(--line); background: var(--panel-solid); border-radius: 12px; padding: 6px; display: grid; justify-items: center; gap: 2px; touch-action: none; user-select: none; cursor: grab; }
.lot img { width: 64px; height: 64px; pointer-events: none; }
.lot .n { position: absolute; top: 4px; left: 6px; font: 700 13px var(--f-step); color: var(--amber); }
.lot small { font-size: 11px; color: var(--ink); text-align: center; line-height: 1.2; max-width: 84px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lot small.c { color: var(--dim); }
.lot.done { opacity: 0.35; cursor: default; }
.lot.done::after { content: '✓'; position: absolute; top: 2px; right: 8px; color: var(--ok); font-weight: 700; }
.lot:hover:not(.done) { border-color: var(--amber); }
.toast { position: absolute; left: 50%; top: 88px; transform: translateX(-50%); background: var(--panel-solid); border: 1px solid var(--amber); color: var(--ink); border-radius: 999px; padding: 8px 18px; font-weight: 600; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); white-space: nowrap; max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis; }
.drag-ghost { position: fixed; z-index: 60; pointer-events: none; width: 64px; height: 64px; transform: translate(-50%, -50%); opacity: 0.8; }

/* ------------------------------------------------ booklet */
.booklet { position: absolute; inset: 0; z-index: 12; display: grid; grid-template-rows: 1fr auto; gap: 10px; padding: 16px; background: radial-gradient(ellipse at 50% 40%, #2a2531, #0d0c11 70%); }
.spread { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0; max-width: 1280px; width: 100%; margin: 0 auto; min-height: 0; perspective: 2200px; filter: drop-shadow(0 30px 40px rgba(0, 0, 0, 0.55)); }
.page { position: relative; background: var(--page); color: var(--page-ink); overflow: hidden; display: flex; flex-direction: column; padding: 22px 26px 34px; min-height: 0; }
.page.left { border-radius: 6px 0 0 6px; box-shadow: inset -26px 0 30px -18px rgba(10, 40, 70, 0.45); }
.page.right { border-radius: 0 6px 6px 0; box-shadow: inset 26px 0 30px -18px rgba(10, 40, 70, 0.45); }
.page.turn-next { animation: turnNext 0.45s ease; transform-origin: left center; }
.page.turn-prev { animation: turnPrev 0.45s ease; transform-origin: right center; }
@keyframes turnNext { from { transform: rotateY(-35deg); opacity: 0.4; } }
@keyframes turnPrev { from { transform: rotateY(35deg); opacity: 0.4; } }
.pno { position: absolute; bottom: 10px; font: 600 12px var(--f-ui); color: #3d5566; }
.page.left .pno { left: 18px; } .page.right .pno { right: 18px; }
.sec-name { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #4f6a7c; white-space: nowrap; }
.step-head { display: flex; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
.step-no { font: 800 44px/0.9 var(--f-step); letter-spacing: -0.02em; color: var(--page-ink); font-variant-numeric: tabular-nums; }
.callout { display: flex; flex-wrap: wrap; gap: 4px 10px; background: var(--callout); border-radius: 8px; padding: 6px 10px; box-shadow: 0 1px 0 rgba(0, 0, 0, 0.12); max-width: 100%; }
.callout .it { display: grid; justify-items: center; font: 700 13px var(--f-step); color: var(--page-ink); }
.callout img { width: 48px; height: 48px; }
.step-img { flex: 1; min-height: 0; display: grid; place-items: center; position: relative; }
.step-img img { max-width: 100%; max-height: 100%; object-fit: contain; }
.step-img .open3d { position: absolute; right: 0; bottom: 0; border: 0; background: rgba(255, 255, 255, 0.6); color: var(--page-ink); border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 600; }
.step-img .open3d:hover { background: #fff; }
.two-steps { display: grid; grid-template-rows: 1fr 1fr; gap: 12px; flex: 1; min-height: 0; }
.two-steps > div { display: flex; flex-direction: column; min-height: 0; }
.cover { background: linear-gradient(170deg, #1b1622 0%, #2a1a1b 55%, #4a2419 100%); color: var(--ink); }
.cover .cover-top { display: flex; justify-content: space-between; align-items: flex-start; }
.cover .age { font: 800 20px var(--f-step); background: var(--amber); color: #1b1305; padding: 4px 10px; border-radius: 6px; }
.cover .setno { font: 800 20px var(--f-step); letter-spacing: 0.04em; }
.cover h2 { font: italic 400 clamp(28px, 4vw, 52px)/1 var(--f-display); margin: 8px 0 4px; }
.cover p { margin: 0; color: var(--dim); }
.cover .step-img { margin-top: 8px; }
.cover .pcs { font: 800 16px var(--f-step); color: var(--amber); }
.page h3 { font: 800 22px var(--f-step); margin: 0 0 8px; }
.page p.note { margin: 0 0 10px; font-size: 14px; max-width: 60ch; }
.bag { display: grid; place-items: center; gap: 10px; flex: 1; text-align: center; }
.bag .bagicon { width: 150px; height: 170px; background: #fff; border-radius: 14px 14px 22px 22px; display: grid; place-items: center; font: 800 72px var(--f-step); color: var(--page-ink); box-shadow: inset 0 -12px 0 rgba(0, 0, 0, 0.06), 0 10px 20px rgba(0, 0, 0, 0.12); position: relative; }
.bag .bagicon::before { content: ''; position: absolute; top: 12px; left: 16px; right: 16px; height: 4px; border-radius: 2px; background: repeating-linear-gradient(90deg, #9fb7c6 0 6px, transparent 6px 10px); }
.figs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; flex: 1; min-height: 0; align-content: start; }
.fig { background: var(--callout); border-radius: 10px; padding: 6px; text-align: center; font-size: 12px; }
.fig img { width: 100%; max-width: 110px; aspect-ratio: 1; display: block; margin: 0 auto; }
.fig b { display: block; font-size: 13px; }
.inv { display: grid; grid-template-columns: repeat(auto-fill, minmax(66px, 1fr)); gap: 6px; align-content: start; overflow: hidden; flex: 1; }
.inv .it { background: var(--callout); border-radius: 6px; padding: 3px; text-align: center; font: 700 11px var(--f-step); }
.inv .it img { width: 44px; height: 44px; display: block; margin: 0 auto; }
.inv .it span { display: block; font: 400 9px var(--f-mono); color: #4a6070; }
.bk-nav { display: flex; align-items: center; gap: 8px; max-width: 1280px; width: 100%; margin: 0 auto; flex-wrap: wrap; }
.bk-nav select { background: #211e29; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; max-width: 280px; }
.bk-nav input { flex: 1; min-width: 120px; accent-color: var(--amber); }
.bk-count { font-variant-numeric: tabular-nums; color: var(--dim); font-size: 13px; min-width: 9ch; text-align: right; }
.build-this { margin-top: auto; align-self: flex-start; border: 0; background: var(--page-ink); color: var(--page); border-radius: 999px; padding: 5px 12px; font-size: 12px; font-weight: 600; }

/* ------------------------------------------------ parts */
.parts { position: absolute; inset: 0; overflow: auto; z-index: 12; background: var(--night); padding-block: 24px 60px; padding-inline: max(16px, calc((100% - 1180px) / 2)); }
.parts h2 { font: italic 400 34px/1.1 var(--f-display); margin: 0 0 6px; text-wrap: balance; }
.parts .lede { color: var(--dim); max-width: 70ch; margin: 0 0 18px; }
.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 20px; }
.summary div { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: #16141c; }
.summary b { display: block; font: 800 26px var(--f-step); font-variant-numeric: tabular-nums; }
.summary span { color: var(--dim); font-size: 13px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0; position: sticky; top: -24px; background: var(--night); padding-block: 8px; z-index: 2; }
.filters input[type="search"] { background: #16141c; border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; min-width: 0; flex: 1 1 200px; }
.filters .chip[aria-pressed="false"] { opacity: 1; text-decoration: none; color: var(--dim); }
.filters .chip[aria-pressed="true"] { background: var(--brick); border-color: var(--brick); color: #fff; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 6px 10px; text-align: left; border-bottom: 1px solid #25222d; vertical-align: middle; }
th { position: sticky; top: 0; background: #1a1820; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); font-weight: 600; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
td img { width: 44px; height: 44px; display: block; }
td .pid { font-family: var(--f-mono); font-size: 13px; color: var(--amber); }
td a { color: var(--dim); text-decoration: none; font-size: 12px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; white-space: nowrap; }
td a:hover { color: var(--ink); }
tr.cat td { background: #15131a; font-weight: 700; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--brick); padding-top: 12px; }
.tier { font-size: 12px; white-space: nowrap; }
.tier i { display: inline-block; width: 6px; height: 10px; margin-right: 1px; border-radius: 1px; background: #3a3544; vertical-align: -1px; }
.tier i.on { background: var(--ok); }
.cols2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; margin-top: 28px; }
.box { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; background: #16141c; min-width: 0; }
.box h3 { margin: 0 0 8px; font-size: 16px; }
.box p, .box li { color: var(--dim); font-size: 14px; }
.box ol { padding-left: 20px; margin: 6px 0; }
.box.wide { grid-column: 1 / -1; }
.box.wide ol { columns: 2 320px; column-gap: 32px; }
.box.wide li { break-inside: avoid; margin-bottom: 6px; }
.box textarea { width: 100%; height: 150px; background: #0d0c11; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; font: 12px/1.4 var(--f-mono); padding: 8px; resize: vertical; }
.box .row { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
.box .copied { color: var(--ok); font-size: 13px; }
.figlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.figlist .f { border: 1px solid var(--line); border-radius: 12px; padding: 10px; background: #16141c; display: grid; grid-template-columns: 64px 1fr; gap: 10px; align-items: center; }
.figlist img { width: 64px; height: 64px; }
.figlist b { display: block; }
.figlist small { color: var(--dim); display: block; line-height: 1.3; }

@media (max-width: 900px) {
  .bar { gap: 8px; }
  .tabs { order: 3; width: 100%; margin: 0; justify-content: flex-start; }
  .radio { margin-left: auto; }
  .radio-text b, .radio-text small { max-width: 120px; }
  #radio-vol { display: none; }
  .panel { top: auto; bottom: 12px; left: 12px; right: 12px; width: auto; max-height: 42%; grid-template-columns: 1fr; }
  .spread { grid-template-columns: minmax(0, 1fr); }
  .page.left { display: none; }
  .page.right { border-radius: 6px; }
  .info-card { bottom: auto; top: 12px; }
}
@media (max-width: 520px) {
  .brand-text h1 { font-size: 20px; }
  .brand-text p { display: none; }
  .radio-station .radio-text { display: none; }
  .build-actions { margin-left: 0; }
  .step-no { font-size: 34px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}

<div id="app" class="app" data-mode="explore">
  <header class="bar">
    <div class="brand">

      <button role="tab" id="tab-explore" data-mode="explore" aria-selected="true">3D house</button>
      <button role="tab" id="tab-booklet" data-mode="booklet" aria-selected="false">Instructions</button>
      <button role="tab" id="tab-build" data-mode="build" aria-selected="false">Build it yourself</button>
      <button role="tab" id="tab-parts" data-mode="parts" aria-selected="false">Parts &amp; buying</button>
    </nav>
    <div class="radio" id="radio">
      <button class="radio-play" id="radio-play" aria-label="Play music" title="Play music">
        <svg viewBox="0 0 24 24" class="i-play"><path d="M7 4l13 8-13 8z"/></svg>
        <svg viewBox="0 0 24 24" class="i-pause"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
      </button>
      <button class="radio-station" id="radio-station" aria-haspopup="true" aria-expanded="false">
        <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span class="radio-text"><b id="radio-name">Murder House Lofi</b><small id="radio-track">tap play · built-in radio</small></span>
      </button>
      <input type="range" id="radio-vol" min="0" max="100" value="60" aria-label="Volume">
      <div class="radio-menu" id="radio-menu" hidden></div>
    </div>
  </header>

  <main class="stage">
    <canvas id="view" aria-label="3D model of the Murder House built from LEGO parts"></canvas>
    <div class="loading" id="loading"><div class="loading-inner"><div class="spinner"></div><p>Laying the first brick…</p></div></div>

    <!-- explore mode -->
    <aside class="panel explore-only" id="explore-panel">
      <section>
        <h2>Floors</h2>
        <div class="chips" id="level-chips"></div>
      </section>
      <section>
        <h2>View</h2>
        <div class="seg" id="view-buttons">
          <button data-view="front">Street</button><button data-view="back">Dollhouse</button><button data-view="top">Above</button>
        </div>
        <label class="slider"><span>Lift floors apart</span><input type="range" id="explode" min="0" max="100" value="0"></label>
        <div class="toggles">
          <label class="switch"><input type="checkbox" id="night"><span>Night</span></label>
          <label class="switch"><input type="checkbox" id="spin"><span>Turntable</span></label>
        </div>
      </section>
      <section>
        <h2>Build timeline</h2>
        <div class="timeline">
          <button class="icon-btn" id="tl-play" aria-label="Play the build">▶</button>
          <input type="range" id="tl" min="0" max="1" value="1" aria-label="Build step">
        </div>
        <p class="tl-label" id="tl-label"></p>
      </section>
      <p class="hint">Drag to orbit · scroll to zoom · right-drag to pan · hover a brick to identify it</p>
    </aside>
    <div class="tip" id="tip" hidden></div>
    <div class="info-card" id="info-card" hidden></div>

    <!-- build mode -->
    <div class="build-hud build-only" id="build-hud">
      <div class="build-top">
        <div class="build-step">
          <span class="build-num" id="b-num">1</span>
          <div><b id="b-title">Base plates</b><small id="b-sub">Bag 1</small></div>
        </div>
        <div class="build-stats"><span id="b-placed">0</span> placed by hand · <span id="b-time">0:00</span></div>
        <div class="build-actions">
          <button id="b-prev" title="Previous step">◀ Step</button>
          <button id="b-hint" aria-pressed="true" title="Show or hide the outlines of where the parts go">Spots shown</button>
          <button id="b-auto" title="Let the parts snap in by themselves">Auto-place</button>
          <button id="b-next" class="primary" title="Next step">Step ▶</button>
        </div>
      </div>
      <div class="tray" id="tray" aria-label="Parts for this step"></div>
      <div class="toast" id="toast" hidden></div>
    </div>

    <!-- instruction booklet -->
    <section class="booklet booklet-only" id="booklet" aria-label="Instruction booklet">
      <div class="spread" id="spread"></div>
      <div class="bk-nav">
        <button id="bk-prev" aria-label="Previous pages">◀</button>
        <select id="bk-jump" aria-label="Jump to"></select>
        <input type="range" id="bk-page" min="0" max="1" value="0" aria-label="Page">
        <span id="bk-count" class="bk-count"></span>
        <button id="bk-next" aria-label="Next pages">▶</button>
      </div>
    </section>

    <!-- parts list -->
    <section class="parts parts-only" id="parts" aria-label="Parts list"></section>
  </main>
</div>
